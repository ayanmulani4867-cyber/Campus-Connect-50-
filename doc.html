<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Campus Connect Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .download-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .icon {
            font-size: 54px;
            margin-bottom: 15px;
        }
        h2 {
            color: #0d47a1;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #555;
            font-size: 14.5px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-download {
            display: inline-block;
            background-color: #1976d2;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.3);
        }
        .btn-download:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
        }
        .btn-deck {
            display: block;
            margin-top: 15px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-deck:hover {
            text-decoration: underline;
        }
        .path-info {
            margin-top: 25px;
            padding: 12px;
            background-color: #f0f4f8;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="download-box">
        <div class="icon">📊</div>
        <h2>Campus Connect Presentation</h2>
        <p>Mini Project (25% Phase) — 7 Slides with roles, tech stack, screenshots & roadmap.</p>
        
        <a id="downloadLink" href="CampusConnect_MiniProject_Presentation.pptx" download="CampusConnect_MiniProject_Presentation.pptx" class="btn-download">
            📥 Click to Download (.PPTX)
        </a>

        <a href="presentation.html" class="btn-deck">
            🖥️ Open Slide Deck in Browser
        </a>

        <div class="path-info">
            <strong>Saved on your PC:</strong><br>
            C:\Users\ayanm\Downloads\CampusConnect_MiniProject_Presentation.pptx
        </div>
    </div>

    <script>
        // Auto trigger download when page opens
        window.addEventListener('DOMContentLoaded', function() {
            const dl = document.getElementById('downloadLink');
            if (dl) {
                // Automatically click after a short delay
                setTimeout(() => {
                    dl.click();
                }, 500);
            }
        });
    </script>
</body>
</html>
